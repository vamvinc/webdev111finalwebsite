<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VinciFoods | Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">VinciFoods</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="order.html">Order</a></li>
            <li><a href="login.html" id="authLink">Login</a></li>
        </ul>
    </nav>

    <header class="hero">
        <h1>Deliciousness Delivered.</h1>
        <p>Premium meals from our kitchen to your doorstep.</p>
        <br>
        <a href="order.html" class="cta-button">Start Your Order</a>
    </header>

    <script>
        const authLink = document.getElementById('authLink');
        // Check if someone is logged in
        if (localStorage.getItem('currentUser')) {
            authLink.innerText = "Logout";
            authLink.href = "#";
            authLink.onclick = () => {
                localStorage.removeItem('currentUser');
                alert("You have logged out.");
                window.location.reload();
            };
        }
    </script>
</body>
</html>
