<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VinciFoods | Our Story</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* --- LOADER & TRANSITION --- */
        #loader-layer {
            position: fixed;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100vh;
            background: #0a051a;
            z-index: 10001;
            transition: left 0.7s cubic-bezier(0.83, 0, 0.17, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #loader-logo {
            width: 220px;
            height: auto;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            filter: drop-shadow(0 0 25px rgba(157, 124, 253, 0.6));
        }

        #loader-layer.active #loader-logo { opacity: 1; transform: scale(1); }

        /* --- FLOATING CART --- */
        .cart-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--accent-purple);
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(157, 124, 253, 0.4);
            z-index: 1000;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--accent-gold);
            color: #000;
            font-weight: 800;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 12px;
            border: 2px solid var(--bg-dark);
        }

        /* --- CONTENT --- */
        .hero h1, .hero p, .intro-text, .delivery-card {
            opacity: 0;
            transform: translateY(30px);
            transition: var(--transition-cool);
        }

        body.loaded .hero h1 { opacity: 1; transform: translateY(0); transition-delay: 0.2s; }
        body.loaded .hero p { opacity: 1; transform: translateY(0); transition-delay: 0.3s; }
    </style>
</head>
<body id="page-body">
    <div id="loader-layer">
        <img src="Image_20260212_002545_039.png" id="loader-logo" alt="Vinci Logo">
    </div>

    <nav>
        <div class="logo-container" onclick="navTo('index.html')" style="cursor: pointer; display: flex; align-items: center; gap: 12px;">
            <img src="Image_20260212_002545_039.png" alt="V" style="height: 40px;">
            <span class="logo">VinciFoods</span>
        </div>
        <ul class="nav-links">
            <li><a href="javascript:void(0)" onclick="navTo('index.html')">Home</a></li>
            <li><a href="javascript:void(0)" class="active" onclick="navTo('aboutus.html')">About</a></li>
            <li><a href="javascript:void(0)" onclick="navTo('order.html')">Order</a></li>
            <li><a href="javascript:void(0)" id="authLink" onclick="handleAuthClick(event)">Login</a></li>
        </ul>
    </nav>

    <main>
        <header class="hero" style="min-height: 50vh; text-align: center; padding-top: 150px;">
            <h1>Our Story</h1>
            <p style="color: var(--text-muted);">Stay Hungry, Stay Purple. ✨</p>
        </header>

        <section style="max-width: 800px; margin: 0 auto; padding: 50px 20px; text-align: center;">
            <h2 style="color: var(--accent-purple);">Who We Are</h2>
            <p>VinciFoods is a local student-led project aimed at providing the fastest delivery experience in Valenzuela.</p>
        </section>
    </main>

    <div class="cart-container" onclick="toggleCart()" id="floating-cart">
        <div class="cart-icon-wrapper" style="position: relative;">
            <span style="font-size: 1.6rem;">🛒</span>
            <span id="cart-count" class="cart-badge">0</span>
        </div>
    </div>

    <div id="sidebar" class="cart-sidebar">
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 25px; border-bottom: 1px solid rgba(157, 124, 253, 0.1);">
            <h3 style="color: #fff; margin:0;">Your Basket</h3>
            <button onclick="toggleCart()" style="background:none; border:none; color:var(--accent-purple); cursor:pointer; font-size:2rem;">&times;</button>
        </div>
        <div id="cart-items" style="flex: 1; overflow-y: auto; padding: 15px;"></div>
        <div style="padding: 25px; border-top: 1px solid rgba(157, 124, 253, 0.2);">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <span>Total:</span>
                <span id="total-price" style="color:var(--accent-gold); font-weight:800;">$0.00</span>
            </div>
            <button class="submit-btn" style="width: 100%; height: 50px;" onclick="checkout()">Checkout</button>
        </div>
    </div>

    <footer><p>&copy; 2026 VinciFoods</p></footer>

    <script>
        function navTo(url) {
            const loader = document.getElementById('loader-layer');
            loader.style.left = '0';
            setTimeout(() => loader.classList.add('active'), 50);
            setTimeout(() => { window.location.href = url; }, 750);
        }

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                document.body.classList.add('loaded');
                checkSession();
                updateUI();
            }, 100);
        });

        function checkSession() {
            const authLink = document.getElementById('authLink');
            if (localStorage.getItem('currentUser')) { authLink.innerText = "Logout"; }
            else { authLink.innerText = "Login"; }
        }

        function handleAuthClick(e) {
            if (localStorage.getItem('currentUser')) {
                if(confirm("Log out?")) { localStorage.removeItem('currentUser'); navTo('index.html'); }
            } else { navTo('login.html'); }
        }

        // CART SCRIPT
        let basket = JSON.parse(localStorage.getItem('userCart')) || [];
        function toggleCart() { document.getElementById('sidebar').classList.toggle('active'); }

        function updateUI() {
            const container = document.getElementById('cart-items');
            const countLabel = document.getElementById('cart-count');
            const totalLabel = document.getElementById('total-price');
            
            container.innerHTML = ''; 
            let total = 0;

            if (basket.length === 0) { 
                container.innerHTML = '<p style="text-align:center; opacity:0.5;">Empty basket.</p>';
            } else { 
                basket.forEach((item, index) => { 
                    total += item.price;
                    const div = document.createElement('div'); 
                    div.style = "display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05);";
                    div.innerHTML = `<span>${item.name}</span><span>$${item.price.toFixed(2)}</span>`;
                    container.appendChild(div); 
                });
            }
            countLabel.innerText = basket.length; 
            totalLabel.innerText = `$${total.toFixed(2)}`;
            localStorage.setItem('userCart', JSON.stringify(basket));
        }

        function removeItem(index) { basket.splice(index, 1); updateUI(); }
        function checkout() { 
            if (basket.length === 0) return alert("Basket is empty!");
            navTo('checkout.html'); 
        }
    </script>
</body>
</html>
