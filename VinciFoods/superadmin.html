<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VINCIFoods | SuperAdmin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav style="background: #2a0a2a; border-bottom: 2px solid var(--accent-gold);">
        <div class="logo" style="color: var(--accent-gold);">SUPERADMIN CONSOLE</div>
        <a href="login.html" class="demo-btn">System Exit</a>
    </nav>

    <div style="padding: 40px 5%;">
        <div class="menu-grid" style="grid-template-columns: repeat(4, 1fr);">
            <div class="food-item" style="border: 1px solid var(--accent-gold);">
                <p>Total Revenue</p>
                <h2 style="color: #0f0;">$42,890</h2>
            </div>
            <div class="food-item">
                <p>Active Users</p>
                <h2>1,402</h2>
            </div>
            <div class="food-item">
                <p>Server Load</p>
                <h2 style="color: var(--accent-gold);">14%</h2>
            </div>
            <div class="food-item">
                <p>Database Status</p>
                <h2 style="color: #4df;">Healthy</h2>
            </div>
        </div>

        <div style="display: flex; gap: 20px; margin-top: 30px;">
            <div class="auth-container" style="flex: 2; max-width: none;">
                <h3>Global Traffic (Real-time)</h3>
                <div style="height: 150px; background: #12091d; border-radius: 10px; margin-top: 15px; display: flex; align-items: flex-end; justify-content: space-around; padding: 10px;">
                    <div style="width: 30px; height: 40%; background: var(--accent-purple);"></div>
                    <div style="width: 30px; height: 70%; background: var(--accent-gold);"></div>
                    <div style="width: 30px; height: 55%; background: var(--accent-purple);"></div>
                    <div style="width: 30px; height: 90%; background: var(--accent-gold);"></div>
                    <div style="width: 30px; height: 60%; background: var(--accent-purple);"></div>
                </div>
            </div>
            
            <div class="auth-container" style="flex: 1; max-width: none;">
                <h3>System Logs</h3>
                <ul style="list-style: none; font-size: 0.8rem; color: #888; margin-top: 10px;">
                    <li>[09:41] Backup Completed</li>
                    <li>[09:30] New Login: admin_manila</li>
                    <li>[09:15] API Key Rotated</li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
