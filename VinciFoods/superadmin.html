<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VinciFoods | SuperAdmin</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --admin-gold: #ffcc33;
            --admin-red: #ff4d4d;
            --admin-bg: #0a051a; /* Synchronized with the rest of the app */
            --accent-purple: #9d7cfd;
        }

        body {
            background: var(--admin-bg);
            background-image: 
                linear-gradient(rgba(157, 124, 253, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(157, 124, 253, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- ADMIN HUD --- */
        .admin-nav {
            background: rgba(10, 5, 26, 0.98);
            border-bottom: 1px solid rgba(157, 124, 253, 0.2);
            backdrop-filter: blur(20px);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 25px;
            border-radius: 24px;
            border: 1px solid rgba(157, 124, 253, 0.1);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            transform: translateY(20px);
            backdrop-filter: blur(10px);
        }

        body.loaded .stat-card { opacity: 1; transform: translateY(0); }

        .stat-card:hover {
            border-color: var(--admin-gold);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 204, 51, 0.1);
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: 800;
            font-family: 'Space Mono', monospace;
            letter-spacing: -1px;
        }

        /* --- DATA TABLE --- */
        .data-table-container {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(157, 124, 253, 0.1);
            border-radius: 20px;
            padding: 25px;
            margin-top: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            font-family: 'Space Mono', monospace;
        }

        th {
            text-align: left;
            color: var(--admin-gold);
            padding: 15px;
            border-bottom: 1px solid rgba(157, 124, 253, 0.2);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: #ccc;
        }

        .status-pill {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: bold;
            background: rgba(77, 255, 121, 0.1);
            color: #0f0;
            border: 1px solid rgba(0, 255, 0, 0.2);
        }

        /* --- TERMINAL --- */
        .terminal-window {
            background: #000;
            border-radius: 16px;
            border: 1px solid rgba(157, 124, 253, 0.2);
            overflow: hidden;
        }

        .log-entry {
            font-family: 'Space Mono', monospace;
            padding: 10px 15px;
            font-size: 0.75rem;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-5px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .bar {
            width: 30px;
            background: linear-gradient(to top, var(--accent-purple), var(--admin-gold));
            border-radius: 6px 6px 0 0;
            transition: height 1s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }

        .btn-shutdown {
            background: rgba(255, 77, 77, 0.1);
            border: 1px solid var(--admin-red);
            color: var(--admin-red);
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'Space Mono';
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-shutdown:hover {
            background: var(--admin-red);
            color: white;
            box-shadow: 0 0 15px rgba(255, 77, 77, 0.4);
        }
    </style>
</head>
<body id="page-body">
    <!-- Branded Transition Layer -->
    <div id="loader-layer" style="position: fixed; top: 0; left: -100%; width: 100%; height: 100vh; background: #0a051a; z-index: 10001; transition: left 0.7s cubic-bezier(0.83, 0, 0.17, 1); pointer-events: none; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px;">
        <img src="Image_20260212_002545_039.png" style="width: 150px; filter: drop-shadow(0 0 15px var(--accent-purple));">
        <h1 style="color: var(--admin-gold); font-family: 'Space Mono'; font-size: 1rem; letter-spacing: 3px;">SYNCING_CORE...</h1>
    </div>

    <nav class="admin-nav">
        <div class="logo-container" style="display: flex; align-items: center; gap: 12px; cursor: pointer;" onclick="navTo('index.html')">
            <img src="Image_20260212_002545_039.png" alt="V" style="height: 30px;">
            <span style="color: var(--admin-gold); font-family: 'Space Mono'; font-weight: 800; font-size: 0.9rem;">VINCIFOODS_CORE_v2.0</span>
        </div>
        <div id="system-clock" style="font-family: 'Space Mono'; color: var(--accent-purple); font-size: 0.9rem; font-weight: 600;">00:00:00</div>
        <button onclick="systemExit()" class="btn-shutdown">TERMINATE SESSION</button>
    </nav>

    <div style="padding: 40px 5%;">
        <header style="margin-bottom: 40px;">
            <h1 style="font-size: 2.2rem; margin-bottom: 5px; font-weight: 800;">Administrative Command</h1>
            <p style="color: var(--text-muted);">Status: <span id="uptime" style="color: #0f0; font-weight: 700;">● CORE ONLINE</span> | Active Admin: SuperVince</p>
        </header>

        <!-- KPI GRID -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px;">
            <div class="stat-card" style="transition-delay: 0.1s;">
                <p style="color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase; font-weight: 700; letter-spacing: 1px;">Est. Revenue</p>
                <h2 class="stat-value" id="totalRev" style="color: #0f0;">$0.00</h2>
            </div>
            <div class="stat-card" style="transition-delay: 0.2s;">
                <p style="color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase; font-weight: 700; letter-spacing: 1px;">Active Squad</p>
                <h2 class="stat-value" id="userCount">0</h2>
            </div>
            <div class="stat-card" style="transition-delay: 0.3s;">
                <p style="color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase; font-weight: 700; letter-spacing: 1px;">Incoming Loads</p>
                <h2 class="stat-value" id="orderCount" style="color: var(--admin-gold);">0</h2>
            </div>
            <div class="stat-card" style="transition-delay: 0.4s;">
                <p style="color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase; font-weight: 700; letter-spacing: 1px;">Network Load</p>
                <h2 class="stat-value" style="color: #4df;">12%</h2>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 30px; margin-top: 30px;">
            <!-- Order Feed -->
            <div class="data-table-container">
                <h3 style="margin-bottom: 20px; font-size: 0.9rem; color: var(--admin-gold); text-transform: uppercase; letter-spacing: 1px;">Recent Transmissions</h3>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>User ID</th>
                                <th>Timestamp</th>
                                <th>Payload</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="order-rows">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Visualizer & Logs -->
            <div style="display: flex; flex-direction: column; gap: 30px;">
                <div style="background: rgba(157, 124, 253, 0.05); padding: 25px; border-radius: 20px; border: 1px solid rgba(157, 124, 253, 0.1);">
                    <h3 style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 20px;">Live Traffic Visualizer</h3>
                    <div style="height: 150px; display: flex; align-items: flex-end; justify-content: space-around; padding-bottom: 10px;">
                        <div class="bar" style="height: 40%"></div>
                        <div class="bar" style="height: 80%"></div>
                        <div class="bar" style="height: 60%"></div>
                        <div class="bar" style="height: 90%"></div>
                        <div class="bar" style="height: 50%"></div>
                    </div>
                </div>

                <div class="terminal-window">
                    <div style="background: rgba(157, 124, 253, 0.1); padding: 10px 15px; font-size: 0.7rem; color: var(--accent-purple); font-weight: 700; border-bottom: 1px solid rgba(157, 124, 253, 0.2);">SECURITY_KERNEL.LOG</div>
                    <div id="log-container" style="height: 200px; overflow-y: auto; padding: 5px 0;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function navTo(url) {
            const loader = document.getElementById('loader-layer');
            loader.style.left = '0';
            setTimeout(() => { window.location.href = url; }, 700);
        }

        // Clock Update
        setInterval(() => {
            document.getElementById('system-clock').innerText = new Date().toLocaleTimeString('en-GB');
        }, 1000);

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => document.body.classList.add('loaded'), 100);
            refreshCore();
        });

        function refreshCore() {
            let users = [];
            // Filter keys that look like emails
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.includes('@') && !key.includes('vinci_')) {
                    try {
                        const userData = JSON.parse(localStorage.getItem(key));
                        users.push({email: key, ...userData});
                    } catch(e) {}
                }
            }

            const orders = JSON.parse(localStorage.getItem('vinci_orders')) || [];
            
            document.getElementById('userCount').innerText = users.length;
            document.getElementById('orderCount').innerText = orders.length;
            
            // Calc Revenue (Mock values for visual feedback)
            const revenue = (users.length * 5.50 + orders.length * 28.75).toFixed(2);
            document.getElementById('totalRev').innerText = `$${revenue}`;

            // Populate Table
            const tbody = document.getElementById('order-rows');
            tbody.innerHTML = orders.length ? '' : '<tr><td colspan="4" style="text-align:center; opacity:0.3; padding: 40px;">NO RECENT PAYLOADS</td></tr>';
            
            orders.slice(-6).reverse().forEach(ord => {
                const row = `<tr>
                    <td style="color: var(--accent-purple); font-weight: 600;">${ord.email || 'GUEST'}</td>
                    <td>${new Date(ord.date).toLocaleTimeString()}</td>
                    <td>${ord.items ? ord.items.length : 0} Items</td>
                    <td><span class="status-pill">ENCRYPTED</span></td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        // Log Engine
        const logs = [
            "Packet filtered", 
            "Handshake verified", 
            "Node stable", 
            "User authorized", 
            "Cart persisted", 
            "Cache cleared", 
            "SSL Handshake OK",
            "Latency: 24ms"
        ];
        
        function addLog() {
            const container = document.getElementById('log-container');
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML = `<span style="color:var(--accent-purple)">[${new Date().toLocaleTimeString()}]</span> ${logs[Math.floor(Math.random()*logs.length)]}`;
            container.prepend(div);
            if(container.children.length > 15) container.lastChild.remove();
        }

        setInterval(addLog, 3000);

        function systemExit() {
            if(confirm("CONFIRM SYSTEM PURGE: Sign out of Admin?")) {
                localStorage.removeItem('currentUser');
                navTo('login.html');
            }
        }

        // Visualizer Update
        setInterval(() => {
            document.querySelectorAll('.bar').forEach(b => {
                const h = (Math.random()*70 + 20);
                b.style.height = h + '%';
            });
        }, 1500);
    </script>
</body>
</html>
