<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VinciFoods | Login & Admin Demo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Side Panel for Demo Access */
        .demo-selector {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed var(--accent-purple);
            text-align: center;
        }
        .demo-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--accent-gold);
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: block;
        }
        .demo-btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .role-btn {
            background: rgba(157, 124, 253, 0.1);
            border: 1px solid var(--accent-purple);
            color: var(--accent-purple);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.3s;
        }
        .role-btn:hover {
            background: var(--accent-purple);
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">VinciFoods</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="aboutus.html">About</a></li>
            <li><a href="order.html">Order</a></li>
            <li><a href="login.html" id="authLink">Login</a></li>
        </ul>
    </nav>

    <div class="auth-container">
        <h2>Sign In</h2>
        <form id="lForm">
            <div class="form-group">
                <label for="lEmail">Email Address</label>
                <input type="email" id="lEmail" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="lPass">Password</label>
                <input type="password" id="lPass" placeholder="Enter your password" required>
            </div>
            <div class="terms-box">
                <input type="checkbox" id="lCheck">
                <label for="lCheck" style="cursor:pointer;">I am a human</label>
            </div>
            <button type="submit" id="lBtn" class="submit-btn" disabled>Sign In</button>
        </form>

        <div class="demo-selector">
            <span class="demo-title">Demo Roles</span>
            <div class="demo-btn-group">
                <button class="role-btn" onclick="quickLogin('admin@vinci.com', 'admin.html')">Admin</button>
                <button class="role-btn" onclick="quickLogin('super@vinci.com', 'superadmin.html')">SuperAdmin</button>
            </div>
        </div>

        <p style="text-align:center; margin-top:20px; color:var(--text-muted); font-size: 0.9rem;">
            New here? <a href="register.html" style="color:var(--accent-purple); text-decoration:none; font-weight:bold;">Register</a>
        </p>
    </div>

    <footer><p>&copy; 2026 VinciFoods | Stay Hungry, Stay Purple.</p></footer>

    <script>
        const lCheck = document.getElementById('lCheck');
        const lBtn = document.getElementById('lBtn');
        lCheck.onchange = () => lBtn.disabled = !lCheck.checked;

        // Function for the Demo Buttons
        function quickLogin(email, targetPage) {
            localStorage.setItem('currentUser', email);
            window.location.href = targetPage;
        }

        document.getElementById('lForm').onsubmit = (e) => {
            e.preventDefault();
            const email = document.getElementById('lEmail').value;
            const pass = document.getElementById('lPass').value;

            // 1. Check for Admin Login
            if (email === "admin@vinci.com") {
                quickLogin(email, 'admin.html');
                return;
            }

            // 2. Check for Super Admin Login
            if (email === "super@vinci.com") {
                quickLogin(email, 'superadmin.html');
                return;
            }

            // 3. Regular User Login
            const storedUser = localStorage.getItem(email);
            if (storedUser) {
                const user = JSON.parse(storedUser);
                if (user.pass === pass) {
                    localStorage.setItem('currentUser', email);
                    alert("Welcome back, " + user.name + "!"); 
                    window.location.href = 'index.html';
                    return;
                }
            }
            alert("Invalid email or password!");
        };

        const authLink = document.getElementById('authLink');
        if (localStorage.getItem('currentUser')) {
            authLink.innerText = "Logout";
            authLink.onclick = () => { 
                localStorage.removeItem('currentUser'); 
                window.location.href = 'login.html';
            };
        }
    </script>
</body>
</html>
