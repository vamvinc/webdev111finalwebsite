<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VinciFoods | Login & Admin Demo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* --- CORE THEME VARIABLES --- */
        :root {
            --bg-dark: #0f0c1d;
            --bg-card: #1a1630;
            --accent-purple: #9d7cfd;
            --accent-gold: #ffcc33;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }

        /* --- CENTERED LAYOUT FIX --- */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navbar Correction */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(157, 124, 253, 0.2);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-purple);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 25px;
            margin: 0;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent-purple);
        }

        /* Centered Container */
        .auth-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-container {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(157, 124, 253, 0.2);
            width: 100%;
            max-width: 400px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
        }

        .auth-container h2 {
            color: var(--accent-purple);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box; /* Keeps input within the container */
            border-radius: 8px;
            border: 1px solid rgba(157, 124, 253, 0.3);
            background: rgba(255,255,255,0.05);
            color: white;
            outline: none;
        }

        .submit-btn {
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        .submit-btn:disabled {
            background: #555;
            cursor: not-allowed;
            color: #888;
        }

        .demo-selector {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed var(--accent-purple);
        }

        .demo-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--accent-gold);
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: block;
        }

        .role-btn {
            background: rgba(157, 124, 253, 0.1);
            border: 1px solid var(--accent-purple);
            color: var(--accent-purple);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin: 0 5px;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .role-btn:hover {
            background: var(--accent-purple);
            color: white;
            transform: translateY(-2px);
        }

        footer {
            padding: 20px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">VinciFoods</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="aboutus.html">About</a></li>
            <li><a href="order.html">Order</a></li>
            <li><a href="login.html" id="authLink">Login</a></li>
        </ul>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-container">
            <h2>Sign In</h2>
            <form id="lForm">
                <div class="form-group">
                    <label for="lEmail">Email Address</label>
                    <input type="email" id="lEmail" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="lPass">Password</label>
                    <input type="password" id="lPass" placeholder="Enter your password" required>
                </div>
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:20px; color:var(--text-muted);">
                    <input type="checkbox" id="lCheck">
                    <label for="lCheck" style="cursor:pointer; font-size: 0.9rem;">I am a human</label>
                </div>
                <button type="submit" id="lBtn" class="submit-btn" disabled>Sign In</button>
            </form>

            <div class="demo-selector">
                <span class="demo-title">Demo Roles</span>
                <div class="demo-btn-group">
                    <button class="role-btn" onclick="quickLogin('admin@vinci.com', 'admin.html')">Admin</button>
                    <button class="role-btn" onclick="quickLogin('super@vinci.com', 'superadmin.html')">SuperAdmin</button>
                </div>
            </div>

            <p style="text-align:center; margin-top:20px; color:var(--text-muted); font-size: 0.9rem;">
                New here? <a href="register.html" style="color:var(--accent-purple); text-decoration:none; font-weight:bold;">Register</a>
            </p>
        </div>
    </div>

    <footer><p>&copy; 2026 VinciFoods | Stay Hungry, Stay Purple. ✨</p></footer>

    <script>
        const lCheck = document.getElementById('lCheck');
        const lBtn = document.getElementById('lBtn');
        const authLink = document.getElementById('authLink');

        lCheck.onchange = () => lBtn.disabled = !lCheck.checked;

        // --- AUTH UI CHECK ---
        function checkAuth() {
            if (localStorage.getItem('currentUser')) {
                authLink.innerText = "Logout";
                authLink.href = "javascript:void(0)"; 
                authLink.onclick = (e) => { 
                    e.preventDefault();
                    localStorage.removeItem('currentUser'); 
                    window.location.reload();
                };
            } else {
                authLink.innerText = "Login";
                authLink.href = "login.html";
                authLink.onclick = null;
            }
        }

        function quickLogin(email, targetPage) {
            localStorage.setItem('currentUser', email);
            window.location.href = targetPage;
        }

        document.getElementById('lForm').onsubmit = (e) => {
            e.preventDefault();
            const email = document.getElementById('lEmail').value;
            const pass = document.getElementById('lPass').value;

            if (email === "admin@vinci.com") {
                quickLogin(email, 'admin.html');
                return;
            }

            if (email === "super@vinci.com") {
                quickLogin(email, 'superadmin.html');
                return;
            }

            const storedUser = localStorage.getItem(email);
            if (storedUser) {
                const user = JSON.parse(storedUser);
                if (user.pass === pass) {
                    localStorage.setItem('currentUser', email);
                    alert("Welcome back, " + user.name + "!"); 
                    window.location.href = 'index.html';
                    return;
                }
            }
            alert("Invalid email or password!");
        };

        // Initialize state
        checkAuth();
    </script>
</body>
</html>
