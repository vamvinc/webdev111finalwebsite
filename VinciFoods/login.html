<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VinciFoods | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <h2>Welcome Back</h2>
        <form id="loginForm">
            <div class="form-group"><label>Email</label><input type="email" id="email" required></div>
            <div class="form-group"><label>Password</label><input type="password" id="pass" required></div>
            <div class="terms-box">
                <label style="cursor:pointer;"><input type="checkbox" id="check"> I am not a robot.</label>
            </div>
            <button type="submit" id="btn" class="submit-btn" disabled>Login</button>
        </form>
        <p style="margin-top:15px; text-align:center;">New here? <a href="register.html" style="color:var(--accent-purple)">Create an account</a></p>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const check = document.getElementById('check');
        const btn = document.getElementById('btn');

        check.onchange = () => btn.disabled = !check.checked;

        form.onsubmit = (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            const storedData = localStorage.getItem(email);

            if (storedData) {
                const user = JSON.parse(storedData);
                if (user.pass === pass) {
                    // Start session
                    localStorage.setItem('currentUser', email);
                    alert("Welcome, " + user.name + "!");
                    window.location.href = 'index.html';
                    return;
                }
            }
            alert("Oops! Invalid email or password.");
        };
    </script>
</body>
</html>
