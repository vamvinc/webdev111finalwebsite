<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VinciFoods | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">VinciFoods</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="aboutus.html">About</a></li>
            <li><a href="order.html">Order</a></li>
            <li><a href="login.html" id="authLink">Login</a></li>
        </ul>
    </nav>

    <div class="auth-container">
        <h2>Login</h2><br>
        <form id="lForm">
            <div class="form-group"><label>Email</label><input type="email" id="lEmail" required></div>
            <div class="form-group"><label>Password</label><input type="password" id="lPass" required></div>
            <div class="terms-box">
                <label><input type="checkbox" id="lCheck"> I am a real person.</label>
            </div>
            <button type="submit" id="lBtn" class="submit-btn" disabled>Login</button>
        </form>
        <p style="text-align:center; margin-top:15px;">New here? <a href="register.html" style="color:var(--accent-purple)">Sign up</a></p>
    </div>

    <script>
        const check = document.getElementById('lCheck');
        const btn = document.getElementById('lBtn');
        check.onchange = () => btn.disabled = !check.checked;

        document.getElementById('lForm').onsubmit = (e) => {
            e.preventDefault();
            const email = document.getElementById('lEmail').value;
            const pass = document.getElementById('lPass').value;
            const saved = localStorage.getItem(email);

            if (saved) {
                const user = JSON.parse(saved);
                if (user.pass === pass) {
                    localStorage.setItem('currentUser', email);
                    alert("Welcome " + user.name);
                    window.location.href = 'index.html';
                    return;
                }
            }
            alert("Invalid Credentials!");
        };
    </script>
</body>
</html>
