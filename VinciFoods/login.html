<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VinciFoods | Login & Admin Demo</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* --- CENTERED LAYOUT FIX --- */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: var(--bg-dark); 
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-container {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(157, 124, 253, 0.2);
            width: 100%;
            max-width: 420px; /* Slightly wider for the 3-button row */
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .auth-container h2 {
            color: var(--accent-purple);
            margin-bottom: 10px;
            text-align: center;
        }

        .auth-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid rgba(157, 124, 253, 0.3);
            background: rgba(0,0,0,0.3);
            color: white;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 8px rgba(157, 124, 253, 0.4);
        }

        .terms-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* --- DEMO ACCESS PANEL --- */
        .demo-selector {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed rgba(157, 124, 253, 0.4);
            text-align: center;
        }
        
        .demo-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--accent-gold);
            letter-spacing: 2px;
            margin-bottom: 12px;
            display: block;
            font-weight: 600;
        }

        .demo-btn-group {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: nowrap; /* Keeps them in one line */
        }

        .role-btn {
            background: rgba(157, 124, 253, 0.15);
            border: 1px solid var(--accent-purple);
            color: var(--accent-purple);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: bold;
            transition: 0.3s;
            flex: 1;
            white-space: nowrap;
        }

        .role-btn:hover {
            background: var(--accent-purple);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(157, 124, 253, 0.3);
        }

        /* Special style for the Demo Account button */
        .demo-alt {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            background: rgba(255, 215, 0, 0.05);
        }
        
        .demo-alt:hover {
            background: var(--accent-gold);
            color: var(--bg-dark);
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">VinciFoods</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="aboutus.html">About</a></li>
            <li><a href="order.html">Order</a></li>
            <li><a href="login.html" id="authLink" class="active">Login</a></li>
        </ul>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-container">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Sign in to track your purple orders.</p>
            
            <form id="lForm">
                <div class="form-group">
                    <label for="lEmail">Email Address</label>
                    <input type="email" id="lEmail" placeholder="vince@example.com" required>
                </div>
                <div class="form-group">
                    <label for="lPass">Password</label>
                    <input type="password" id="lPass" placeholder="••••••••" required>
                </div>
                <div class="terms-box">
                    <input type="checkbox" id="lCheck" style="accent-color: var(--accent-purple);">
                    <label for="lCheck" style="cursor:pointer;">I'm a human (No bots allowed)</label>
                </div>
                <button type="submit" id="lBtn" class="submit-btn" style="width: 100%;" disabled>Sign In</button>
            </form>

            <div class="demo-selector">
                <span class="demo-title">Developer Demo Access</span>
                <div class="demo-btn-group">
                    <button type="button" class="role-btn" onclick="quickLogin('admin@vinci.com', 'admin.html')">Admin</button>
                    <!-- Demo Account Button Placed Beside Admin -->
                    <button type="button" class="role-btn demo-alt" onclick="window.location.href='demoaccount.html'">Demo Account</button>
                    <button type="button" class="role-btn" onclick="quickLogin('super@vinci.com', 'superadmin.html')">SuperAdmin</button>
                </div>
            </div>

            <p style="text-align:center; margin-top:25px; color:var(--text-muted); font-size: 0.85rem;">
                Don't have an account? <a href="register.html" style="color:var(--accent-purple); text-decoration:none; font-weight:bold;">Register Here</a>
            </p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 VinciFoods | Stay Hungry, Stay Purple. ✨</p>
    </footer>

    <script>
        const lCheck = document.getElementById('lCheck');
        const lBtn = document.getElementById('lBtn');
        
        lCheck.onchange = () => lBtn.disabled = !lCheck.checked;

        function quickLogin(email, targetPage) {
            // Using direct string storage to ensure index.html reads it correctly
            localStorage.setItem('currentUser', email);
            window.location.href = targetPage;
        }

        document.getElementById('lForm').onsubmit = (e) => {
            e.preventDefault();
            const email = document.getElementById('lEmail').value;
            const pass = document.getElementById('lPass').value;

            if (email === "admin@vinci.com") {
                quickLogin(email, 'admin.html');
                return;
            }

            if (email === "super@vinci.com") {
                quickLogin(email, 'superadmin.html');
                return;
            }

            const storedUser = localStorage.getItem(email);
            if (storedUser) {
                const user = JSON.parse(storedUser);
                if (user.pass === pass) {
                    localStorage.setItem('currentUser', email);
                    alert(`Welcome back, ${user.name}!`); 
                    window.location.href = 'index.html';
                    return;
                }
            }
            alert("Oops! Invalid email or password. Please try again.");
        };

        // Header Auth Link Sync
        const authLink = document.getElementById('authLink');
        const currentUser = localStorage.getItem('currentUser');
        if (currentUser && currentUser !== "null") {
            authLink.innerText = "Logout";
            authLink.onclick = (e) => { 
                e.preventDefault();
                localStorage.removeItem('currentUser'); 
                window.location.reload();
            };
        }
    </script>
</body>
</html>
