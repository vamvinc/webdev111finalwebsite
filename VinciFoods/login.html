<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VinciFoods | Login & Admin Demo</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* --- CENTERED LAYOUT FIX --- */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: var(--bg-dark); 
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-container {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 28px;
            border: 1px solid rgba(157, 124, 253, 0.2);
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
        }

        .auth-container h2 {
            color: var(--accent-purple);
            margin-bottom: 10px;
            text-align: center;
            font-weight: 800;
        }

        .auth-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(157, 124, 253, 0.2);
            background: rgba(10, 10, 15, 0.5);
            color: white;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 15px rgba(157, 124, 253, 0.2);
            background: rgba(10, 10, 15, 0.8);
        }

        .terms-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* --- DEMO ACCESS PANEL --- */
        .demo-selector {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid rgba(157, 124, 253, 0.1);
            text-align: center;
        }
        
        .demo-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--accent-gold);
            letter-spacing: 2px;
            margin-bottom: 15px;
            display: block;
            font-weight: 700;
        }

        .demo-btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .role-btn {
            background: rgba(157, 124, 253, 0.05);
            border: 1px solid rgba(157, 124, 253, 0.3);
            color: var(--accent-purple);
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 700;
            transition: 0.3s;
            flex: 1;
            white-space: nowrap;
        }

        .role-btn:hover {
            background: var(--accent-purple);
            color: white;
            border-color: var(--accent-purple);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(157, 124, 253, 0.3);
        }

        .demo-alt {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            background: rgba(255, 215, 0, 0.05);
        }
        
        .demo-alt:hover {
            background: var(--accent-gold);
            color: var(--bg-dark);
            border-color: var(--accent-gold);
        }
    </style>
</head>
<body id="page-body">

    <nav>
        <div class="logo" style="cursor: pointer;" onclick="navTo('index.html')">VinciFoods</div>
        <ul class="nav-links">
            <li><a href="index.html" onclick="event.preventDefault(); navTo('index.html');">Home</a></li>
            <li><a href="aboutus.html" onclick="event.preventDefault(); navTo('aboutus.html');">About</a></li>
            <li><a href="order.html" onclick="event.preventDefault(); navTo('order.html');">Order</a></li>
            <li><a href="login.html" id="authLink" class="active">Login</a></li>
        </ul>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-container">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Sign in to track your purple orders.</p>
            
            <form id="lForm">
                <div class="form-group">
                    <label for="lEmail">Email Address</label>
                    <input type="email" id="lEmail" placeholder="vince@example.com" required>
                </div>
                <div class="form-group">
                    <label for="lPass">Password</label>
                    <input type="password" id="lPass" placeholder="••••••••" required>
                </div>
                <div class="terms-box">
                    <input type="checkbox" id="lCheck" style="accent-color: var(--accent-purple);">
                    <label for="lCheck" style="cursor:pointer;">I'm a human (No bots allowed)</label>
                </div>
                <button type="submit" id="lBtn" class="submit-btn" style="width: 100%;" disabled>Sign In</button>
            </form>

            <div class="demo-selector">
                <span class="demo-title">Developer Demo Access</span>
                <div class="demo-btn-group">
                    <button type="button" class="role-btn" onclick="quickLogin('Admin_Vinci', 'admin', 'admin.html')">Admin</button>
                    <button type="button" class="role-btn demo-alt" onclick="navTo('demoaccount.html')">POV Select</button>
                    <button type="button" class="role-btn" onclick="quickLogin('SuperVinci', 'superadmin', 'superadmin.html')">Super</button>
                </div>
            </div>

            <p style="text-align:center; margin-top:25px; color:var(--text-muted); font-size: 0.85rem;">
                Don't have an account? <a href="register.html" style="color:var(--accent-purple); text-decoration:none; font-weight:bold;" onclick="event.preventDefault(); navTo('register.html');">Register Here</a>
            </p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 VinciFoods | Stay Hungry, Stay Purple. ✨</p>
    </footer>

    <script>
        // --- PAGE TRANSITION LOGIC ---
        document.addEventListener("DOMContentLoaded", () => {
            document.body.classList.add('loaded');
        });

        function navTo(url) {
            document.body.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = url;
            }, 500);
        }

        const lCheck = document.getElementById('lCheck');
        const lBtn = document.getElementById('lBtn');
        
        lCheck.onchange = () => lBtn.disabled = !lCheck.checked;

        // Optimized for consistency with index.html greeting
        function quickLogin(username, role, targetPage) {
            const sessionData = {
                user: username,
                role: role,
                isDemo: true,
                timestamp: new Date().getTime()
            };
            localStorage.setItem('currentUser', JSON.stringify(sessionData));
            navTo(targetPage); // Use navTo for smooth transition
        }

        document.getElementById('lForm').onsubmit = (e) => {
            e.preventDefault();
            const email = document.getElementById('lEmail').value;
            const pass = document.getElementById('lPass').value;

            // Direct Hardcoded Admin Access
            if (email === "admin@vinci.com") {
                quickLogin('Admin_Vinci', 'admin', 'admin.html');
                return;
            }

            // Registered User Check
            const storedUser = localStorage.getItem(email);
            if (storedUser) {
                const user = JSON.parse(storedUser);
                if (user.pass === pass) {
                    const sessionData = {
                        user: user.name,
                        email: email,
                        role: 'customer'
                    };
                    localStorage.setItem('currentUser', JSON.stringify(sessionData));
                    alert(`Welcome back, ${user.name}!`); 
                    navTo('index.html'); // Use navTo for smooth transition
                    return;
                }
            }
            alert("Oops! Invalid email or password. Please try again.");
        };

        // Header Sync & Logout Transition
        const authLink = document.getElementById('authLink');
        if (localStorage.getItem('currentUser')) {
            authLink.innerText = "Logout";
            authLink.onclick = (e) => { 
                e.preventDefault();
                if(confirm("Ready to sign out?")) {
                    localStorage.removeItem('currentUser'); 
                    navTo('login.html'); // Fade out then reload/redirect
                }
            };
        }
    </script>
</body>
</html>
