<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VinciFoods | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <h2 style="color:var(--accent-purple); margin-bottom: 20px;">Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPass" placeholder="Enter your password" required>
            </div>
            
            <div class="terms-box">
                <p><strong>Note:</strong> Log in to access your VinciFoods dashboard.</p>
                <label style="margin-top:10px; display:block; cursor:pointer;">
                    <input type="checkbox" id="termsCheck"> I accept the terms.
                </label>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn" disabled>Login</button>
        </form>
        <p style="margin-top:20px;">No account? <a href="register.html" style="color:var(--accent-purple)">Register here</a></p>
    </div>

    <script>
        const checkbox = document.getElementById('termsCheck');
        const btn = document.getElementById('submitBtn');
        const form = document.getElementById('loginForm');

        checkbox.addEventListener('change', function() {
            btn.disabled = !this.checked;
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const emailInput = document.getElementById('loginEmail').value;
            const passInput = document.getElementById('loginPass').value;

            // Step 1: Look for the email key in storage
            const savedData = localStorage.getItem(emailInput);

            if (savedData) {
                // Step 2: Convert the string back into a JS object
                const user = JSON.parse(savedData);

                // Step 3: Compare passwords
                if (user.userPass === passInput) {
                    alert('Login successful! Welcome back, ' + user.username);
                    window.location.href = 'index.html';
                } else {
                    alert('Error: Incorrect password.');
                }
            } else {
                alert('Error: No account found with that email. Please Register.');
            }
        });
    </script>
</body>
</html>
