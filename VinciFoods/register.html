<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VinciFoods | Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <h2 style="color:var(--accent-purple); margin-bottom: 20px;">Create Account</h2>
        <form id="regForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="regName" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="email@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPass" placeholder="••••••••" required>
            </div>
            
            <div class="terms-box">
                <p><strong>Educational Terms:</strong> This is a project. Your data is stored locally in your browser only.</p>
                <label style="margin-top:10px; display:block; cursor:pointer;">
                    <input type="checkbox" id="termsCheck"> I accept the terms.
                </label>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn" disabled>Register</button>
        </form>
        <p style="margin-top:20px;">Have an account? <a href="login.html" style="color:var(--accent-purple)">Login here</a></p>
    </div>

    <script>
        const checkbox = document.getElementById('termsCheck');
        const btn = document.getElementById('submitBtn');
        const form = document.getElementById('regForm');

        checkbox.addEventListener('change', function() {
            btn.disabled = !this.checked;
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPass').value;

            // Step 1: Create a user object
            const newUser = {
                username: name,
                userEmail: email,
                userPass: password
            };

            // Step 2: Save the user to localStorage using their email as the "Key"
            localStorage.setItem(email, JSON.stringify(newUser));

            alert('Account saved for ' + name + '! Redirecting to login...');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
