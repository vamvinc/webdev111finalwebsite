<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VinciFoods | Join the Squad</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* --- BRANDED LOGO TRANSITION --- */
        #loader-layer {
            position: fixed;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100vh;
            background: #0a051a; /* Synchronized deep violet */
            z-index: 10001;
            transition: left 0.7s cubic-bezier(0.83, 0, 0.17, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #loader-logo {
            width: 220px;
            height: auto;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            filter: drop-shadow(0 0 25px rgba(157, 124, 253, 0.6));
        }

        #loader-layer.active #loader-logo {
            opacity: 1;
            transform: scale(1);
        }

        /* --- AUTH LAYOUT --- */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: var(--bg-dark);
            overflow-x: hidden;
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
            position: relative;
        }

        /* Ambient glow effect */
        .auth-wrapper::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: var(--accent-purple);
            filter: blur(180px);
            opacity: 0.12;
            z-index: 0;
        }

        .auth-container {
            position: relative;
            z-index: 1;
            background: var(--bg-card);
            padding: 40px;
            border-radius: 28px;
            border: 1px solid rgba(157, 124, 253, 0.2);
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        body.loaded .auth-container {
            opacity: 1;
            transform: translateY(0);
        }

        .auth-container h2 {
            color: #fff;
            margin-bottom: 10px;
            text-align: center;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .auth-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--accent-purple);
            margin-bottom: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid rgba(157, 124, 253, 0.1);
            background: rgba(10, 10, 15, 0.4);
            color: white;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: var(--accent-purple);
            background: rgba(157, 124, 253, 0.05);
            box-shadow: 0 0 20px rgba(157, 124, 253, 0.1);
        }

        .terms-box {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin: 25px 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .terms-box input[type="checkbox"] {
            margin-top: 4px;
            accent-color: var(--accent-purple);
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .submit-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            filter: grayscale(1);
        }
    </style>
</head>
<body id="page-body">
    <!-- Branded Transition Layer -->
    <div id="loader-layer">
        <img src="Image_20260212_002545_039.png" id="loader-logo" alt="Vinci Logo">
    </div>

    <nav>
        <div class="logo-container" onclick="navTo('index.html')" style="cursor: pointer; display: flex; align-items: center; gap: 12px;">
            <img src="Image_20260212_002545_039.png" alt="V" style="height: 40px; filter: drop-shadow(0 0 5px var(--accent-purple));">
            <span class="logo">VinciFoods</span>
        </div>
        <ul class="nav-links">
            <li><a href="javascript:void(0)" onclick="navTo('login.html')">Login</a></li>
        </ul>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-container">
            <h2>Create Account</h2>
            <p class="auth-subtitle">Join the squad for high-key gourmet speed.</p>
            
            <form id="rForm">
                <div class="form-group">
                    <label for="rName">Full Name</label>
                    <input type="text" id="rName" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label for="rEmail">Email Address</label>
                    <input type="email" id="rEmail" placeholder="vince@example.com" required>
                </div>
                <div class="form-group">
                    <label for="rPass">Password</label>
                    <input type="password" id="rPass" placeholder="••••••••" required minlength="6">
                </div>
                <div class="terms-box">
                    <input type="checkbox" id="rCheck">
                    <label for="rCheck" style="cursor:pointer; line-height: 1.4;">
                        I agree to the Terms of Service and acknowledge that purple is the superior flavor.
                    </label>
                </div>
                <button type="submit" id="rBtn" class="submit-btn" style="width: 100%;" disabled>Register Now</button>
            </form>

            <p style="text-align:center; margin-top:25px; color:var(--text-muted); font-size: 0.9rem;">
                Already a member? <a href="javascript:void(0)" style="color:var(--accent-purple); text-decoration:none; font-weight:700;" onclick="navTo('login.html')">Sign In</a>
            </p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 VinciFoods | Stay Hungry, Stay Purple. ✨</p>
    </footer>

    <script>
        // --- PAGE TRANSITION ---
        function navTo(url) {
            const loader = document.getElementById('loader-layer');
            loader.style.left = '0';
            setTimeout(() => { loader.classList.add('active'); }, 100);
            setTimeout(() => { window.location.href = url; }, 800);
        }

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 100);
        });

        // --- REGISTRATION LOGIC ---
        const rCheck = document.getElementById('rCheck');
        const rBtn = document.getElementById('rBtn');
        
        rCheck.onchange = () => rBtn.disabled = !rCheck.checked;

        document.getElementById('rForm').onsubmit = (e) => {
            e.preventDefault();
            const email = document.getElementById('rEmail').value.trim().toLowerCase();
            const name = document.getElementById('rName').value.trim();
            const pass = document.getElementById('rPass').value;

            // Reserved Logic Check
            if (email.includes('admin@vinci.com')) {
                alert("Restricted developer email. Please use a personal email.");
                return;
            }

            // Persistence Check
            if (localStorage.getItem(email)) {
                alert("Account already exists! Please login instead.");
                navTo('login.html');
                return;
            }

            // Create Secure User Entry
            const newUser = {
                user: name,
                pass: pass,
                joined: new Date().toISOString()
            };

            localStorage.setItem(email, JSON.stringify(newUser));
            
            alert(`Welcome to the squad, ${name}! Log in to start your first order.`);
            navTo('login.html');
        };

        // Auth Link Sync
        if (localStorage.getItem('currentUser')) {
            const authLink = document.querySelector('.nav-links a');
            if(authLink) authLink.innerText = "Logout";
        }
    </script>
</body>
</html>
