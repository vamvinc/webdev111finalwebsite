<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VinciFoods | Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <h2>Join VinciFoods</h2>
        <form id="regForm">
            <div class="form-group"><label>Full Name</label><input type="text" id="name" required></div>
            <div class="form-group"><label>Email Address</label><input type="email" id="email" required></div>
            <div class="form-group"><label>Password</label><input type="password" id="pass" required></div>
            <div class="terms-box">
                <p><strong>Terms:</strong> This is an educational demo. No real data is collected.</p>
                <label style="cursor:pointer;"><input type="checkbox" id="check"> I accept these terms.</label>
            </div>
            <button type="submit" id="btn" class="submit-btn" disabled>Create Account</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('regForm');
        const check = document.getElementById('check');
        const btn = document.getElementById('btn');

        check.onchange = () => btn.disabled = !check.checked;

        form.onsubmit = (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const user = { 
                name: document.getElementById('name').value,
                pass: document.getElementById('pass').value 
            };
            // Save user with email as the unique key
            localStorage.setItem(email, JSON.stringify(user));
            alert("Account created! Please log in.");
            window.location.href = 'login.html';
        };
    </script>
</body>
</html>
