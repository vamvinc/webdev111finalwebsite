<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VinciFoods | Join the Squad</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* --- CENTERED LAYOUT FIX --- */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: var(--bg-dark);
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-container {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(157, 124, 253, 0.2);
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
        }

        .auth-container h2 {
            color: var(--accent-purple);
            margin-bottom: 10px;
            text-align: center;
            font-size: 2rem;
        }

        .auth-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(157, 124, 253, 0.3);
            background: rgba(0,0,0,0.3);
            color: white;
            outline: none;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-group input:focus {
            border-color: var(--accent-purple);
            background: rgba(157, 124, 253, 0.05);
            box-shadow: 0 0 10px rgba(157, 124, 253, 0.2);
        }

        .terms-box {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 25px;
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .terms-box input[type="checkbox"] {
            margin-top: 3px;
            accent-color: var(--accent-purple);
            cursor: pointer;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(1);
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">VinciFoods</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="aboutus.html">About</a></li>
            <li><a href="order.html">Order</a></li>
            <li><a href="login.html" id="authLink">Login</a></li>
        </ul>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-container">
            <h2>Create Account</h2>
            <p class="auth-subtitle">Join the purple movement. High-key flavors await.</p>
            
            <form id="rForm">
                <div class="form-group">
                    <label for="rName">Full Name</label>
                    <input type="text" id="rName" placeholder="Vince" required>
                </div>
                <div class="form-group">
                    <label for="rEmail">Email Address</label>
                    <input type="email" id="rEmail" placeholder="vince@vinci.com" required>
                </div>
                <div class="form-group">
                    <label for="rPass">Password</label>
                    <input type="password" id="rPass" placeholder="••••••••" required minlength="6">
                </div>
                <div class="terms-box">
                    <input type="checkbox" id="rCheck">
                    <label for="rCheck" style="cursor:pointer;">
                        I agree to the Terms of Service and acknowledge that purple is the superior color.
                    </label>
                </div>
                <button type="submit" id="rBtn" class="submit-btn" style="width: 100%;" disabled>Register Now</button>
            </form>

            <p style="text-align:center; margin-top:25px; color:var(--text-muted); font-size: 0.9rem;">
                Already a member? <a href="login.html" style="color:var(--accent-purple); text-decoration:none; font-weight:bold;">Sign In</a>
            </p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 VinciFoods | Stay Hungry, Stay Purple. ✨</p>
    </footer>

    <script>
        const rCheck = document.getElementById('rCheck');
        const rBtn = document.getElementById('rBtn');
        
        // Enable button only when terms are accepted
        rCheck.onchange = () => rBtn.disabled = !rCheck.checked;

        document.getElementById('rForm').onsubmit = (e) => {
            e.preventDefault();
            const email = document.getElementById('rEmail').value;
            
            // Basic check if email already exists
            if (localStorage.getItem(email)) {
                alert("This email is already registered! Try logging in.");
                return;
            }

            const user = {
                name: document.getElementById('rName').value,
                pass: document.getElementById('rPass').value
            };

            // Store user data
            localStorage.setItem(email, JSON.stringify(user));
            
            alert("Registration successful! Welcome to the family.");
            window.location.href = 'login.html';
        };

        // Sync Nav Auth Link
        const authLink = document.getElementById('authLink');
        const currentUser = localStorage.getItem('currentUser');
        
        if (currentUser) {
            authLink.innerText = "Logout";
            authLink.href = "javascript:void(0)";
            authLink.onclick = () => { 
                localStorage.removeItem('currentUser'); 
                window.location.reload(); 
            };
        }
    </script>
</body>
</html>
