<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VinciFoods | Register</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* --- CENTERED LAYOUT FIX --- */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-container {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(157, 124, 253, 0.2);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .auth-container h2 {
            color: var(--accent-purple);
            margin-bottom: 25px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(157, 124, 253, 0.3);
            background: rgba(0,0,0,0.2);
            color: white;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: var(--accent-purple);
        }

        .terms-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">VinciFoods</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="aboutus.html">About</a></li>
            <li><a href="order.html">Order</a></li>
            <li><a href="login.html" id="authLink">Login</a></li>
        </ul>
    </nav>

    <!-- CENTERED WRAPPER -->
    <div class="auth-wrapper">
        <div class="auth-container">
            <h2>Register</h2>
            <form id="rForm">
                <div class="form-group">
                    <label for="rName">Full Name</label>
                    <input type="text" id="rName" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label for="rEmail">Email Address</label>
                    <input type="email" id="rEmail" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="rPass">Password</label>
                    <input type="password" id="rPass" placeholder="Create a password" required>
                </div>
                <div class="terms-box">
                    <input type="checkbox" id="rCheck">
                    <label for="rCheck" style="cursor:pointer;">I accept the terms</label>
                </div>
                <button type="submit" id="rBtn" class="submit-btn" style="width: 100%;" disabled>Register Now</button>
            </form>
            <p style="text-align:center; margin-top:20px; color:var(--text-muted); font-size: 0.9rem;">
                Already have an account? <a href="login.html" style="color:var(--accent-purple); text-decoration:none; font-weight:bold;">Login</a>
            </p>
        </div>
    </div>

    <footer><p>&copy; 2026 VinciFoods | Stay Hungry, Stay Purple.</p></footer>

    <script>
        const rCheck = document.getElementById('rCheck');
        const rBtn = document.getElementById('rBtn');
        rCheck.onchange = () => rBtn.disabled = !rCheck.checked;

        document.getElementById('rForm').onsubmit = (e) => {
            e.preventDefault();
            const email = document.getElementById('rEmail').value;
            const user = {
                name: document.getElementById('rName').value,
                pass: document.getElementById('rPass').value
            };
            localStorage.setItem(email, JSON.stringify(user));
            alert("Registration successful! Go ahead and login.");
            window.location.href = 'login.html';
        };

        const authLink = document.getElementById('authLink');
        if (localStorage.getItem('currentUser')) {
            authLink.innerText = "Logout";
            authLink.onclick = () => { 
                localStorage.removeItem('currentUser'); 
                window.location.reload(); 
            };
        }
    </script>
</body>
</html>
