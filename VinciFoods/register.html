<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VinciFoods | Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">VinciFoods</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="aboutus.html">About</a></li>
            <li><a href="order.html">Order</a></li>
            <li><a href="login.html" id="authLink">Login</a></li>
        </ul>
    </nav>

    <div class="auth-container">
        <h2>Join Us</h2><br>
        <form id="regForm">
            <div class="form-group"><label>Name</label><input type="text" id="rName" required></div>
            <div class="form-group"><label>Email</label><input type="email" id="rEmail" required></div>
            <div class="form-group"><label>Password</label><input type="password" id="rPass" required></div>
            <div class="terms-box">
                <label><input type="checkbox" id="rCheck"> I accept educational terms.</label>
            </div>
            <button type="submit" id="rBtn" class="submit-btn" disabled>Register</button>
        </form>
        <p style="text-align:center; margin-top:15px;">Already have an account? <a href="login.html" style="color:var(--accent-purple)">Log in</a></p>
    </div>

    <script>
        const check = document.getElementById('rCheck');
        const btn = document.getElementById('rBtn');
        check.onchange = () => btn.disabled = !check.checked;

        document.getElementById('regForm').onsubmit = (e) => {
            e.preventDefault();
            const email = document.getElementById('rEmail').value;
            const user = { name: document.getElementById('rName').value, pass: document.getElementById('rPass').value };
            localStorage.setItem(email, JSON.stringify(user));
            alert("Account Saved!"); window.location.href = 'login.html';
        };
    </script>
</body>
</html>
