<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VinciFoods | Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <h2 style="color:var(--accent-purple); margin-bottom: 20px;">Create Account</h2>
        <form id="regForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" required>
            </div>
            
            <div class="terms-box">
                <p><strong>Educational Terms:</strong> This is a project. No real data is stored. Enjoy the design!</p>
                <label style="margin-top:10px; display:block; cursor:pointer;">
                    <input type="checkbox" id="termsCheck"> I agree.
                </label>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn" disabled>Register</button>
        </form>
        <p style="margin-top:20px;">Have an account? <a href="login.html" style="color:var(--accent-purple)">Login here</a></p>
    </div>

    <script>
        const checkbox = document.getElementById('termsCheck');
        const btn = document.getElementById('submitBtn');
        const form = document.getElementById('regForm');

        checkbox.addEventListener('change', function() {
            btn.disabled = !this.checked;
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Account created! Now please log in.');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
