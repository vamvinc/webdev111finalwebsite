<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VinciFoods | Demo Access</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        .demo-container {
            max-width: 800px;
            margin: 100px auto;
            text-align: center;
            padding: 20px;
        }
        .demo-grid {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        .demo-card {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid rgba(157, 124, 253, 0.1);
            transition: 0.3s;
            flex: 1;
            min-width: 280px;
            cursor: pointer;
        }
        .demo-card:hover {
            border-color: var(--accent-purple);
            transform: translateY(-10px);
        }
        .demo-icon { font-size: 3rem; margin-bottom: 15px; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">VinciFoods</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html">Back to Login</a></li>
        </ul>
    </nav>

    <div class="demo-container">
        <h1 style="color: var(--accent-gold); font-size: 2.5rem;">Choose Your POV</h1>
        <p style="color: var(--text-muted);">Select a role to instantly enter the VinciFoods ecosystem.</p>

        <div class="demo-grid">
            <!-- CUSTOMER DEMO -->
            <div class="demo-card" onclick="loginAs('Vince', 'customer', 'index.html')">
                <div class="demo-icon">🍕</div>
                <h3 style="color: #fff;">Customer View</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 10px;">
                    Browse the menu, add to basket, and test the checkout flow.
                </p>
                <button class="cta-button" style="margin-top: 20px; width: 100%;">Enter as Vince</button>
            </div>

            <!-- ADMIN DEMO -->
            <div class="demo-card" onclick="loginAs('Admin_Vinci', 'admin', 'admin.html')">
                <div class="demo-icon">👑</div>
                <h3 style="color: #fff;">Admin Dashboard</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 10px;">
                    Manage orders, track analytics, and oversee operations.
                </p>
                <button class="cta-button" style="margin-top: 20px; width: 100%; background: var(--accent-purple);">Enter Admin</button>
            </div>
        </div>
    </div>

    <script>
        function loginAs(username, role, redirect) {
            // Save the demo session to localStorage
            const sessionData = {
                user: username,
                role: role,
                isDemo: true,
                timestamp: new Date().getTime()
            };
            
            localStorage.setItem('currentUser', JSON.stringify(sessionData));
            
            // Visual feedback before redirecting
            alert(`Entering as ${username}... It's giving access.`);
            window.location.href = redirect;
        }
    </script>
</body>
</html>
