<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VinciFoods | Checkout</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: var(--bg-dark);
            overflow-x: hidden;
        }

        .checkout-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        .checkout-container {
            background: var(--bg-card);
            padding: 45px;
            border-radius: 28px;
            border: 1px solid rgba(157, 124, 253, 0.2);
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease-out;
        }

        body.loaded .checkout-container {
            opacity: 1;
            transform: translateY(0);
        }

        .checkout-container h2 {
            color: #fff;
            margin-bottom: 30px;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -1px;
        }

        /* --- FIXED INPUT STYLING --- */
        .form-group {
            margin-bottom: 22px;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: var(--accent-purple);
            margin-bottom: 8px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .form-group input, 
        .form-group select {
            width: 100%; /* Fixes the short input issue */
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(157, 124, 253, 0.2);
            background: rgba(10, 10, 15, 0.5);
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box; /* Ensures padding doesn't break width */
        }

        .form-group input:focus, 
        .form-group select:focus {
            border-color: var(--accent-purple);
            background: rgba(10, 10, 15, 0.8);
            box-shadow: 0 0 15px rgba(157, 124, 253, 0.2);
        }

        /* Styling the dropdown options */
        select option {
            background: #1a1a2e;
            color: white;
        }

        .order-summary {
            background: rgba(157, 124, 253, 0.05);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 1px dashed rgba(157, 124, 253, 0.3);
        }
    </style>
</head>
<body id="page-body">
    <!-- Transition Layer Reveal (Curtain) -->
    <div id="loader-layer" style="position: fixed; top: 0; left: -100%; width: 100%; height: 100vh; background: linear-gradient(90deg, var(--accent-purple), var(--accent-neon)); z-index: 10001; transition: left 0.7s cubic-bezier(0.83, 0, 0.17, 1); pointer-events: none;"></div>

    <nav>
        <div class="logo" style="cursor: pointer;" onclick="navTo('index.html')">VinciFoods</div>
        <ul class="nav-links">
            <li><a href="javascript:void(0)" onclick="navTo('index.html')">Home</a></li>
            <li><a href="javascript:void(0)" onclick="navTo('order.html')">Menu</a></li>
        </ul>
    </nav>

    <div class="checkout-wrapper">
        <div class="checkout-container">
            <h2>Delivery Details</h2>

            <div class="order-summary">
                <p style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: 5px;">Basket Total</p>
                <h3 id="display-total" style="color: var(--accent-gold); font-size: 1.5rem;">$0.00</h3>
            </div>
            
            <form id="checkoutForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="cName" placeholder="Vince" required>
                </div>

                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="tel" id="cPhone" placeholder="09123456789" required>
                </div>

                <div class="form-group">
                    <label>Delivery Address</label>
                    <input type="text" id="cAddress" placeholder="Street, City, Metro Manila" required>
                </div>

                <div class="form-group">
                    <label>Payment Method</label>
                    <select id="cPayment" required>
                        <option value="" disabled selected>Select Payment Method</option>
                        <option value="cod">Cash on Delivery (COD)</option>
                        <option value="gcash">GCash</option>
                        <option value="card">Credit/Debit Card</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn" style="width: 100%; margin-top: 10px;">Confirm & Place Order</button>
            </form>
        </div>
    </div>

    <script>
        function navTo(url) {
            const loader = document.getElementById('loader-layer');
            loader.style.left = '0';
            setTimeout(() => { window.location.href = url; }, 700);
        }

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => { document.body.classList.add('loaded'); }, 100);

            // Load Total from LocalStorage
            const basket = JSON.parse(localStorage.getItem('userCart')) || [];
            const total = basket.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('display-total').innerText = `$${total.toFixed(2)}`;

            // Auto-fill name if logged in
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if (user) {
                document.getElementById('cName').value = user.name || user.user;
            }
        });

        document.getElementById('checkoutForm').onsubmit = (e) => {
            e.preventDefault();
            
            // Create Order Record
            const newOrder = {
                id: "ORD-" + Math.floor(Math.random() * 100000),
                items: JSON.parse(localStorage.getItem('userCart')),
                customer: document.getElementById('cName').value,
                address: document.getElementById('cAddress').value,
                method: document.getElementById('cPayment').value,
                date: new Date().toLocaleString()
            };

            // Save to Admin accessible orders
            let orders = JSON.parse(localStorage.getItem('vinci_orders')) || [];
            orders.push(newOrder);
            localStorage.setItem('vinci_orders', JSON.stringify(orders));

            // Clear Basket
            localStorage.removeItem('userCart');

            alert("Order Placed! Thank you for choosing VinciFoods.");
            navTo('index.html');
        };
    </script>
</body>
</html>
