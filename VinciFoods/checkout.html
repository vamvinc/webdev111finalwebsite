<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VinciFoods | Secure Checkout</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        .checkout-section {
            padding: 60px 10%;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 900px) {
            .checkout-section { grid-template-columns: 1fr; padding: 20px 5%; }
        }

        /* Entrance Animations */
        .hero h1, .hero p, .summary-card {
            opacity: 0;
            transform: translateY(30px) skewY(1deg);
            transition: var(--transition-cool);
        }

        body.loaded .hero h1 { opacity: 1; transform: translateY(0) skewY(0); transition-delay: 0.1s; }
        body.loaded .hero p  { opacity: 1; transform: translateY(0) skewY(0); transition-delay: 0.2s; }
        body.loaded .summary-card:nth-child(1) { opacity: 1; transform: translateY(0) skewY(0); transition-delay: 0.3s; }
        body.loaded .summary-card:nth-child(2) { opacity: 1; transform: translateY(0) skewY(0); transition-delay: 0.4s; }

        .summary-card {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(157, 124, 253, 0.1);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.95rem;
        }

        .final-total-display {
            font-size: 1.8rem;
            color: var(--accent-gold);
            font-weight: 800;
            margin-top: 25px;
            text-align: right;
            letter-spacing: -1px;
        }

        select.checkout-input option {
            background-color: #1a1a1a; 
            color: #ffffff;
            padding: 10px;
        }

        .checkout-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-purple);
            font-weight: 700;
        }

        @media print {
            nav, .submit-btn, .print-btn, .form-group, h2, .logo, .cart-toggle {
                display: none !important;
            }
            body { background: white; color: black; }
            .summary-card { border: none; background: white; width: 100%; box-shadow: none; }
            .final-total-display { color: black; }
            .summary-item { border-bottom: 1px solid #eee; }
        }
    </style>
</head>
<body id="page-body">
    <!-- Transition Layer -->
    <div id="loader-layer" style="position: fixed; top: 0; left: -100%; width: 100%; height: 100vh; background: linear-gradient(90deg, var(--accent-purple), var(--accent-neon)); z-index: 10001; transition: left 0.7s cubic-bezier(0.83, 0, 0.17, 1); pointer-events: none;"></div>

    <nav>
        <div class="logo" style="cursor: pointer;" onclick="navTo('index.html')">VinciFoods</div>
        <ul class="nav-links">
            <li><a href="javascript:void(0)" onclick="navTo('order.html')">Return to Menu</a></li>
        </ul>
    </nav>

    <header class="hero" style="min-height: auto; padding: 40px 0; text-align: center;">
        <h1>Secure Checkout</h1>
        <p>Complete your order to satisfy those cravings. ⚡</p>
    </header>

    <section class="checkout-section">
        <!-- Delivery Details -->
        <div class="summary-card">
            <h2 style="color: var(--text-white); margin-bottom: 30px; font-weight: 800;">Delivery Details</h2>
            <form id="paymentForm">
                <div class="form-group">
                    <label class="checkout-label">Full Name</label>
                    <input type="text" id="custName" class="checkout-input" placeholder="Vince" required>
                </div>
                
                <div class="form-group">
                    <label class="checkout-label">Contact Number</label>
                    <input type="tel" id="custPhone" class="checkout-input" placeholder="09123456789" pattern="[0-9]{11}" maxlength="11" oninput="this.value = this.value.replace(/[^0-9]/g, '');" required>
                </div>

                <div class="form-group">
                    <label class="checkout-label">Delivery Address</label>
                    <input type="text" id="custAddr" class="checkout-input" placeholder="Street, City, Metro Manila" required>
                </div>

                <div class="form-group">
                    <label class="checkout-label">Payment Method</label>
                    <select id="payMethod" class="checkout-input" style="width: 100%;" required>
                        <option value="" disabled selected>Select Payment Method</option>
                        <option value="GCash">GCash</option>
                        <option value="Cash on Delivery">Cash on Delivery</option>
                        <option value="Maya">Maya</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn" style="width: 100%; margin-top: 30px; font-size: 1.1rem;">Confirm & Place Order</button>
            </form>
        </div>

        <!-- Order Summary -->
        <div class="summary-card" style="height: fit-content;">
            <h2 style="color: var(--text-white); margin-bottom: 30px; font-weight: 800;">Your Order</h2>
            <div id="final-items-list">
                <!-- Items injected here -->
            </div>
            <div class="final-total-display" id="grand-total">₱0.00</div>
            
            <hr style="border: 0; border-top: 1px solid rgba(157,124,253,0.2); margin: 30px 0;">
            
            <button onclick="generateReceipt()" class="print-btn" style="width: 100%; background: transparent; border: 1px solid var(--accent-gold); color: var(--accent-gold); padding: 12px; border-radius: 12px; cursor: pointer; transition: 0.3s; font-weight: 600;">
                Review Receipt 🖨️
            </button>
            <p style="font-size: 0.75rem; color: var(--text-muted); text-align: center; margin-top: 15px;">
                Verified Secure Transaction • VinciFoods 2026
            </p>
        </div>
    </section>

    <script>
        function navTo(url) {
            const loader = document.getElementById('loader-layer');
            loader.style.left = '0';
            setTimeout(() => { window.location.href = url; }, 700);
        }

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => { document.body.classList.add('loaded'); }, 100);

            // Pre-fill user data
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if (user && user.user) {
                document.getElementById('custName').value = user.user;
            }
            renderCheckout();
        });

        // Auth Check
        if (!localStorage.getItem('currentUser')) { window.location.href = 'login.html'; }

        let basket = JSON.parse(localStorage.getItem('userCart')) || [];
        let total = 0;

        function renderCheckout() {
            const container = document.getElementById('final-items-list');
            if (basket.length === 0) { window.location.href = 'order.html'; return; }

            container.innerHTML = '';
            total = 0;
            basket.forEach(item => {
                total += item.price;
                const div = document.createElement('div');
                div.className = 'summary-item';
                div.innerHTML = `
                    <span style="color: var(--text-white)">${item.name}</span>
                    <span style="color: var(--accent-gold); font-weight: bold;">₱${item.price.toFixed(2)}</span>
                `;
                container.appendChild(div);
            });
            document.getElementById('grand-total').innerText = `Total: ₱${total.toFixed(2)}`;
        }

        function generateReceipt() {
            const form = document.getElementById('paymentForm');
            if (!form.checkValidity()) { form.reportValidity(); return; }

            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const addr = document.getElementById('custAddr').value;
            const method = document.getElementById('payMethod').value;
            const date = new Date().toLocaleString();
            
            const receiptWindow = window.open('', '_blank');
            receiptWindow.document.write(`
                <html>
                <head>
                    <title>VinciFoods Receipt | ${name}</title>
                    <style>
                        body { font-family: 'Courier New', Courier, monospace; padding: 40px; color: #111; line-height: 1.4; max-width: 400px; margin: auto; background: #fdfdfd; }
                        .header { text-align: center; border-bottom: 2px dashed #333; padding-bottom: 15px; margin-bottom: 15px; }
                        .details { font-size: 0.85rem; margin-bottom: 15px; }
                        .item { display: flex; justify-content: space-between; margin: 4px 0; font-size: 0.9rem; }
                        .total { border-top: 2px solid #333; margin-top: 15px; padding-top: 8px; font-weight: bold; font-size: 1.1rem; text-align: right; }
                        .footer { text-align: center; margin-top: 30px; font-style: italic; font-size: 0.75rem; border-top: 1px solid #eee; padding-top: 10px; }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <h2 style="margin:0; letter-spacing: 2px;">VINCIFOODS</h2>
                        <p style="font-size: 0.7rem; margin: 5px 0;">${date}</p>
                        <p style="font-size: 0.7rem; margin: 0;">TXN ID: #${Math.floor(Math.random()*1000000)}</p>
                    </div>
                    <div class="details">
                        <b>CUSTOMER:</b> ${name}<br>
                        <b>PHONE:</b> ${phone}<br>
                        <b>ADDRESS:</b> ${addr}<br>
                        <b>METHOD:</b> ${method}
                    </div>
                    <hr style="border: 0; border-top: 1px dashed #333;">
                    <div>
                        ${basket.map(item => `
                            <div class="item">
                                <span>${item.name}</span>
                                <span>₱${item.price.toFixed(2)}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="total">GRAND TOTAL: ₱${total.toFixed(2)}</div>
                    <div class="footer">
                        <p>Stay Hungry, Stay Purple. ✨</p>
                        <p>Thank you for choosing VinciFoods!</p>
                    </div>
                    <script>window.onload = function() { window.print(); }<\/script>
                </body>
                </html>
            `);
            receiptWindow.document.close();
        }

        document.getElementById('paymentForm').onsubmit = (e) => {
            e.preventDefault();
            
            // Push to Admin Records
            const newOrder = {
                id: "#VFC-" + (100 + Math.floor(Math.random() * 900)),
                customer: document.getElementById('custName').value,
                items: basket.map(i => i.name).join(', '),
                total: `₱${total.toFixed(2)}`,
                status: "PREPARING",
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            
            const orders = JSON.parse(localStorage.getItem('vinci_orders')) || [];
            orders.unshift(newOrder); // Add to top of list
            localStorage.setItem('vinci_orders', JSON.stringify(orders));

            if (confirm("Order Confirmed! Open Receipt?")) {
                generateReceipt();
            }

            localStorage.removeItem('userCart');
            const btn = document.querySelector('.submit-btn');
            btn.innerText = "Order Placed! Redirecting...";
            btn.style.background = "#27c93f";
            
            setTimeout(() => { navTo('index.html'); }, 2000);
        };
    </script>
</body>
</html>
