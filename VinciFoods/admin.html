<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VinciFoods | Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">Vinci Admin</div>
        <a href="login.html" class="outline-btn" style="text-decoration: none;">Logout</a>
    </nav>

    <main style="padding: 40px 10%;">
        <h2 style="color: var(--accent-gold); margin-bottom: 30px; font-size: 2rem;">Store Analytics</h2>
        
        <!-- Analytics Grid -->
        <div class="menu-grid">
            <div class="admin-card">
                <p>Daily Sales</p>
                <h1 style="color: var(--accent-purple);">$1,240.00</h1>
            </div>
            <div class="admin-card">
                <p>Pending Orders</p>
                <h1 style="color: var(--accent-gold);">14</h1>
            </div>
            <div class="admin-card">
                <p>Active Riders</p>
                <h1 style="color: var(--accent-purple);">8</h1>
            </div>
        </div>

        <!-- Transactions Section -->
        <div class="auth-card" style="max-width: 100%; margin-top: 40px;">
            <h3 style="color: var(--text-white); margin-bottom: 20px;">Recent Transactions</h3>
            
            <div style="overflow-x: auto;"> <!-- Prevents table from breaking on mobile -->
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Status</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>#VF-9921</td>
                            <td><span class="status-badge" style="background: rgba(255, 204, 51, 0.2); color: var(--accent-gold);">Preparing</span></td>
                            <td>$24.50</td>
                        </tr>
                        <tr>
                            <td>#VF-9920</td>
                            <td><span class="status-badge" style="background: rgba(68, 221, 255, 0.2); color: #4df;">Delivered</span></td>
                            <td>$12.00</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 VinciFoods | Admin Control Panel</p>
    </footer>
</body>
</html>
