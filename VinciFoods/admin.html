<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VinciFoods | Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* --- LOGO TRANSITION STYLES --- */
        #loader-layer {
            position: fixed;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100vh;
            /* Matches the dark purple background of Image_20260212_002545_039.jpg */
            background: #1a1625; 
            z-index: 10001;
            transition: left 0.7s cubic-bezier(0.83, 0, 0.17, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #loader-logo {
            width: 200px;
            height: auto;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.5s ease-out;
            filter: drop-shadow(0 0 15px rgba(157, 124, 253, 0.4));
        }

        #loader-layer.active #loader-logo {
            opacity: 1;
            transform: scale(1);
        }

        /* Admin Specific Layout */
        .admin-container {
            max-width: 1200px;
            margin: 120px auto;
            padding: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(157, 124, 253, 0.2);
            text-align: center;
        }

        .stat-card h3 { color: var(--accent-purple); margin-bottom: 10px; }
        .stat-card p { font-size: 2rem; font-weight: 800; color: var(--accent-gold); }

        /* Smooth Entrance */
        .admin-container {
            opacity: 0;
            transform: translateY(20px);
            transition: 0.8s ease-out;
        }
        body.loaded .admin-container {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body id="page-body">

    <!-- Transition Layer with Logo -->
    <div id="loader-layer">
        <img src="Image_20260212_002545_039.jpg" id="loader-logo" alt="Vinci Logo">
    </div>

    <nav>
        <div class="logo" onclick="navTo('index.html')" style="cursor: pointer;">VinciFoods</div>
        <ul class="nav-links">
            <li><a href="javascript:void(0)" onclick="navTo('index.html')">Home</a></li>
            <li><a href="javascript:void(0)" onclick="navTo('aboutus.html')">About</a></li>
            <li><a href="javascript:void(0)" onclick="navTo('order.html')">Order</a></li>
            <li><a href="javascript:void(0)" onclick="handleAuthAction()" id="authLink">Logout</a></li>
        </ul>
    </nav>

    <main class="admin-container">
        <header style="margin-bottom: 50px;">
            <h1 style="font-size: 2.5rem;">Admin Dashboard</h1>
            <p style="color: var(--text-muted);">Welcome back, Administrator. Here is the daily overview.</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Sales</h3>
                <p id="total-sales">$0.00</p>
            </div>
            <div class="stat-card">
                <h3>Orders Today</h3>
                <p id="order-count">0</p>
            </div>
            <div class="stat-card">
                <h3>New Users</h3>
                <p id="user-count">0</p>
            </div>
        </div>

        <section class="delivery-card" style="padding: 30px;">
            <h2 style="margin-bottom: 20px; color: var(--accent-purple);">Recent Orders</h2>
            <div id="admin-orders-list" style="color: var(--text-muted);">
                No recent orders to display.
            </div>
        </section>
    </main>

    <footer><p>&copy; 2026 VinciFoods | Stay Hungry, Stay Purple. ✨</p></footer>

    <script>
        // --- ADMIN SECURITY CHECK ---
        function checkAdminAuth() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            // Assuming admin has a specific flag or you just check if anyone is logged in for now
            if (!currentUser) {
                alert("Access Denied. Please login.");
                window.location.href = 'login.html';
            }
            const authLink = document.getElementById('authLink');
            authLink.innerText = "Logout";
        }

        function handleAuthAction() {
            if (confirm("Logout from Admin Panel?")) {
                localStorage.removeItem('currentUser');
                navTo('index.html');
            }
        }

        // --- NAVIGATION & TRANSITIONS ---
        function navTo(url) {
            const loader = document.getElementById('loader-layer');
            loader.style.left = '0';
            setTimeout(() => {
                loader.classList.add('active');
            }, 100);
            setTimeout(() => { 
                window.location.href = url; 
            }, 800);
        }

        document.addEventListener("DOMContentLoaded", () => {
            checkAdminAuth();
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 100);
            
            // Mock data for Admin display
            const basketHistory = JSON.parse(localStorage.getItem('userCart')) || [];
            document.getElementById('order-count').innerText = basketHistory.length;
        });
    </script>
</body>
</html>
