<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VinciFoods | Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* --- LOGO TRANSITION STYLES --- */
        #loader-layer {
            position: fixed;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100vh;
            background: #0a051a; 
            z-index: 10001;
            transition: left 0.7s cubic-bezier(0.83, 0, 0.17, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #loader-logo {
            width: 220px;
            height: auto;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            filter: drop-shadow(0 0 25px rgba(157, 124, 253, 0.6));
        }

        #loader-layer.active #loader-logo {
            opacity: 1;
            transform: scale(1);
        }

        /* Admin Specific Layout */
        .admin-container {
            max-width: 1200px;
            margin: 120px auto;
            padding: 20px;
            opacity: 0;
            transform: translateY(20px);
            transition: 0.8s ease-out;
        }

        body.loaded .admin-container {
            opacity: 1;
            transform: translateY(0);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(157, 124, 253, 0.2);
            text-align: center;
            transition: var(--transition-smooth);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-purple);
        }

        .stat-card h3 { color: var(--accent-purple); margin-bottom: 10px; font-size: 1rem; }
        .stat-card p { font-size: 2.2rem; font-weight: 800; color: var(--accent-gold); }

    </style>
</head>
<body id="page-body">

    <!-- Transition Layer with PNG Logo -->
    <div id="loader-layer">
        <img src="Image_20260212_002545_039.png" id="loader-logo" alt="Vinci Logo">
    </div>

    <nav>
        <div class="logo-container" onclick="navTo('index.html')" style="cursor: pointer; display: flex; align-items: center; gap: 12px;">
            <img src="Image_20260212_002545_039.png" alt="V" style="height: 40px; filter: drop-shadow(0 0 5px var(--accent-purple));">
            <span class="logo">VinciFoods</span>
        </div>
        <ul class="nav-links">
            <li><a href="javascript:void(0)" onclick="navTo('index.html')">Home</a></li>
            <li><a href="javascript:void(0)" onclick="navTo('aboutus.html')">About</a></li>
            <li><a href="javascript:void(0)" onclick="navTo('order.html')">Order</a></li>
            <li><a href="javascript:void(0)" onclick="handleAuthAction()" id="authLink">Logout</a></li>
        </ul>
    </nav>

    <main class="admin-container">
        <header style="margin-bottom: 50px;">
            <div class="admin-badge" style="margin-bottom: 15px;">SUPERADMIN ACCESS</div>
            <h1 style="font-size: 2.8rem; letter-spacing: -1px;">Dashboard</h1>
            <p style="color: var(--text-muted); font-size: 1.1rem;">Welcome back, Vince. System monitoring is online.</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Sales</h3>
                <p id="total-sales">$0.00</p>
            </div>
            <div class="stat-card">
                <h3>Orders Today</h3>
                <p id="order-count">0</p>
            </div>
            <div class="stat-card">
                <h3>New Users</h3>
                <p id="user-count">0</p>
            </div>
        </div>

        <section class="feature-item" style="padding: 40px; text-align: left;">
            <h2 style="margin-bottom: 25px; color: var(--accent-purple); display: flex; align-items: center; gap: 10px;">
                <span>📋</span> Recent Orders
            </h2>
            <div id="admin-orders-list" style="color: var(--text-muted); border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px;">
                No active orders in the transmission queue.
            </div>
        </section>
    </main>

    <footer><p>&copy; 2026 VinciFoods | System Admin Console</p></footer>

    <script>
        // --- ADMIN SECURITY CHECK ---
        function checkAdminAuth() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser) {
                alert("Access Denied. Redirecting to login...");
                window.location.href = 'login.html';
            }
            const authLink = document.getElementById('authLink');
            authLink.innerText = "Logout";
        }

        function handleAuthAction() {
            if (confirm("Logout from Admin Panel?")) {
                localStorage.removeItem('currentUser');
                navTo('index.html');
            }
        }

        // --- NAVIGATION & TRANSITIONS ---
        function navTo(url) {
            const loader = document.getElementById('loader-layer');
            loader.style.left = '0';
            setTimeout(() => {
                loader.classList.add('active');
            }, 100);
            setTimeout(() => { 
                window.location.href = url; 
            }, 800);
        }

        document.addEventListener("DOMContentLoaded", () => {
            checkAdminAuth();
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 100);
            
            // Sync dashboard with actual cart data
            const basketHistory = JSON.parse(localStorage.getItem('userCart')) || [];
            document.getElementById('order-count').innerText = basketHistory.length;

            // Simple math for sales display
            let total = 0;
            basketHistory.forEach(item => total += item.price);
            document.getElementById('total-sales').innerText = `$${total.toFixed(2)}`;
        });
    </script>
</body>
</html>
