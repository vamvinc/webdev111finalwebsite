<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VinciFoods | Order</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">VinciFoods</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="order.html">Order</a></li>
            <li><a href="login.html" id="authLink">Login</a></li>
        </ul>
    </nav>

    <div class="menu-grid">
        <div class="food-item">
            <h3>Vinci Burger</h3>
            <p style="color:var(--text-muted)">Double beef with purple onion jam.</p>
            <p style="color:var(--accent-gold); margin: 10px 0;">$12.99</p>
            <button class="submit-btn" onclick="alert('Added to cart!')">Order Now</button>
        </div>
        <div class="food-item">
            <h3>Truffle Pasta</h3>
            <p style="color:var(--text-muted)">Creamy pasta with black truffle oil.</p>
            <p style="color:var(--accent-gold); margin: 10px 0;">$16.50</p>
            <button class="submit-btn" onclick="alert('Added to cart!')">Order Now</button>
        </div>
    </div>

    <script>
        const authLink = document.getElementById('authLink');
        if (localStorage.getItem('currentUser')) {
            authLink.innerText = "Logout";
            authLink.href = "#";
            authLink.onclick = () => {
                localStorage.removeItem('currentUser');
                window.location.reload();
            };
        }
    </script>
</body>
</html>
