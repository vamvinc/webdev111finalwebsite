<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VinciFoods | Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">VinciFoods</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="aboutus.html">About</a></li>
            <li><a href="order.html">Order</a></li>
            <li><a href="login.html" id="authLink">Login</a></li>
        </ul>
    </nav>

    <section>
        <h2 style="color:var(--accent-purple); margin-bottom: 20px;">Signature Menu</h2>
        <div class="menu-grid">
            <div class="food-item">
                <h3>Vinci Burger</h3>
                <p style="color:var(--accent-gold);">$12.00</p>
                <button class="submit-btn" onclick="alert('Added!')">Add to Cart</button>
            </div>
            <div class="food-item">
                <h3>Lavender Pasta</h3>
                <p style="color:var(--accent-gold);">$14.50</p>
                <button class="submit-btn" onclick="alert('Added!')">Add to Cart</button>
            </div>
        </div>
    </section>

    <script>
        const authLink = document.getElementById('authLink');
        if (localStorage.getItem('currentUser')) {
            authLink.innerText = "Logout";
            authLink.href = "#";
            authLink.onclick = () => { localStorage.removeItem('currentUser'); window.location.reload(); };
        }
    </script>
</body>
</html>
